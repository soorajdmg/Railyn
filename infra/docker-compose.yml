services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: railyn
      POSTGRES_USER: railyn_user
      POSTGRES_PASSWORD: railyn_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railyn_user -d railyn"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
